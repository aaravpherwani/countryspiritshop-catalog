<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Country Spirit Shop - Product Catalog</title>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- PapaParse for CSV processing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.parse.js"></script>

  <style>
    .product-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .img-container {
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
    }
    .img-container img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-amber-900 text-amber-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Country Spirit Shop</h1>
        <p class="text-amber-200 text-sm mt-1">Woodbury, CT • Online Product Catalog</p>
      </div>
      
      <!-- Search Input -->
      <div class="w-full md:w-96 relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search spirits, wine, beer..." 
          class="w-full pl-10 pr-4 py-2 rounded-lg text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner"
        />
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    
    <!-- Controls Bar -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-200">
      <div id="productCount" class="text-slate-600 font-medium">
        Loading catalog...
      </div>
      
      <div class="flex items-center gap-2">
        <label for="categoryFilter" class="text-sm font-medium text-slate-700">Filter:</label>
        <select id="categoryFilter" class="bg-white border border-slate-300 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
          <option value="ALL">All Categories</option>
        </select>
      </div>
    </div>

    <!-- Product Grid -->
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamic Product Cards Injected Here -->
    </div>

    <!-- Empty State -->
    <div id="noResults" class="hidden text-center py-16">
      <i class="fa-solid fa-wine-bottle text-5xl text-slate-300 mb-3"></i>
      <p class="text-lg text-slate-500 font-medium">No matching products found.</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="bg-slate-900 text-slate-400 py-6 mt-12 border-t border-slate-800">
    <div class="max-w-7xl mx-auto px-4 text-center text-sm">
      <p>&copy; Country Spirit Shop. All rights reserved.</p>
    </div>
  </footer>

  <!-- App Script -->
  <script>
    const DEFAULT_PLACEHOLDER = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 24 24' fill='none' stroke='%23cbd5e1' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='3' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Ccircle cx='8.5' cy='8.5' r='1.5'%3E%3C/circle%3E%3Cpolyline points='21 15 16 10 5 21'%3E%3C/polyline%3E%3C/svg%3E";

    let catalogData = [];

    document.addEventListener("DOMContentLoaded", () => {
      fetchCatalog();

      document.getElementById("searchInput").addEventListener("input", filterAndRender);
      document.getElementById("categoryFilter").addEventListener("change", filterAndRender);
    });

    async function fetchCatalog() {
      try {
        Papa.parse("final.csv", {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            catalogData = results.data;
            populateCategoryFilter(catalogData);
            renderCatalog(catalogData);
          },
          error: function(err) {
            console.error("Error parsing CSV:", err);
            document.getElementById("productCount").innerText = "Error loading product data.";
          }
        });
      } catch (err) {
        console.error("Fetch failed:", err);
      }
    }

    function populateCategoryFilter(products) {
      const select = document.getElementById("categoryFilter");
      const categories = new Set();

      products.forEach(p => {
        if (p.category) categories.add(p.category.trim());
      });

      Array.from(categories).sort().forEach(cat => {
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat;
        select.appendChild(option);
      });
    }

    function filterAndRender() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const category = document.getElementById("categoryFilter").value;

      const filtered = catalogData.filter(item => {
        const nameMatch = (item.name || "").toLowerCase().includes(query);
        const brandMatch = (item.brand || "").toLowerCase().includes(query);
        const upcMatch = (item.upc || "").includes(query);

        const categoryMatch = category === "ALL" || (item.category && item.category.trim() === category);

        return (nameMatch || brandMatch || upcMatch) && categoryMatch;
      });

      renderCatalog(filtered);
    }

    function renderCatalog(products) {
      const grid = document.getElementById("productGrid");
      const countEl = document.getElementById("productCount");
      const noResults = document.getElementById("noResults");

      grid.innerHTML = "";
      countEl.innerText = `Showing ${products.length} items`;

      if (products.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      noResults.classList.add("hidden");

      products.forEach(product => {
        const imageUrl = (product.image_url && product.image_url.startsWith("http")) 
          ? product.image_url 
          : DEFAULT_PLACEHOLDER;

        const card = document.createElement("div");
        card.className = "product-card bg-white rounded-xl border border-slate-200 overflow-hidden flex flex-col justify-between shadow-sm";

        card.innerHTML = `
          <div>
            <div class="img-container p-4 border-b border-slate-100 relative">
              <img 
                src="${imageUrl}" 
                alt="${escapeHtml(product.name || 'Product Image')}"
                onerror="this.onerror=null; this.src='${DEFAULT_PLACEHOLDER}';"
                loading="lazy"
              />
            </div>
            <div class="p-4">
              <div class="text-xs font-semibold text-amber-800 tracking-wide uppercase mb-1">
                ${escapeHtml(product.brand || product.category || 'Spirits')}
              </div>
              <h2 class="font-bold text-slate-800 text-base leading-snug line-clamp-2">
                ${escapeHtml(product.name || 'Unnamed Product')}
              </h2>
              ${product.size ? `<p class="text-xs text-slate-500 mt-1">${escapeHtml(product.size)}</p>` : ''}
            </div>
          </div>

          <div class="px-4 py-3 bg-slate-50 border-t border-slate-100 flex items-center justify-between">
            <span class="text-lg font-bold text-slate-900">
              ${product.price ? `$${parseFloat(product.price).toFixed(2)}` : 'In Store'}
            </span>
            <i class="fa-solid fa-wand-magic-sparkles text-amber-600 text-sm" title="Catalog Item"></i>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => {
        const escapeMap = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        };
        return escapeMap[match];
      });
    }
  </script>
</body>
</html>
