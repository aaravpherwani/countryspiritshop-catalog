name: Process New Inventory Upload

on:
  push:
    paths:
      - 'items.csv'           # Triggers whenever you upload/replace items.csv
  workflow_dispatch:          # Manual trigger button

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run Pipeline
        run: python pipeline_with_cache.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add image_cache.json final.csv new.csv
          git commit -m "Auto-processed inventory update: generated descriptions, updated final.csv & new.csv" || exit 0
          git push
